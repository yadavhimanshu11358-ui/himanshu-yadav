<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Himanshu Yadav</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #070b19; color: #e2e8f0; text-align: center; padding: 24px;
    }
    .box {
      max-width: 500px; background: rgba(17, 24, 49, 0.85);
      border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 22px; padding: 42px 30px;
    }
    h1 {
      font-size: 4.5rem; margin: 0 0 10px;
      background: linear-gradient(135deg, #6366f1, #14b8a6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    p { color: #94a3b8; margin-bottom: 26px; line-height: 1.6; }
    .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a {
      text-decoration: none; padding: 11px 20px; border-radius: 11px; font-weight: 600; font-size: 0.92rem;
    }
    .primary { background: linear-gradient(135deg, #6366f1, #14b8a6); color: #fff; }
    .outline { background: rgba(255,255,255,0.06); color: #fff; border: 1px solid rgba(255,255,255,0.15); }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2 style="margin-bottom: 10px; color: #fff;">Page Not Found</h2>
    <p>Oops! The page you are looking for might have been moved or doesn't exist.</p>
    <div class="btns">
      <a href="/" class="primary">← Back to Home</a>
      <a href="/blog/" class="outline">Explore Blog</a>
    </div>
  </div>
</body>
</html>
